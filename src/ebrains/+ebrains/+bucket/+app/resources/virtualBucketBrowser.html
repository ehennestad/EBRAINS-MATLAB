<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Virtual bucket</title>
<!--
  Page of the virtual bucket browser. A host shows the page and holds the
  files, the Data Proxy client and the virtual bucket rules: MATLAB
  (ebrains.bucket.app.VirtualBucketBrowser, in a uihtml component) or
  Python (ebrains-bucket-sync, in pywebview). The page is the view only.

  PROTOCOL

  The host sends the page events and the page sends the host requests.
  Both have a name and data, and the data is JSON text in either direction.
  Paths are relative to the folder of the virtual bucket, with "/" between
  the segments, as in the shared spec of ebrains-bucket-sync.

  Events from the host
    state     The bucket, the folder and every file with its state:
                {bucketName, localFolder, prefix, isListed, listedAt,
                 revealLabel, message,
                 files: {path: [], state: [], localBytes: [], remoteBytes: [],
                         modified: []}}
              The lists under files have one entry per file, in one order.
                path        - path of the file
                state       - "online_only", "downloaded", "differs" or
                              "local_only" (spec/README.md#file-states)
                localBytes  - size of the local file, null if there is none
                remoteBytes - size of the object, null if it is not known
                modified    - time of the last change of the local file as
                              "yyyy-MM-dd HH:mm" in local time, "" if none
              bucketName and prefix name the bucket and the folder of it
              that the virtual bucket holds ("" for the whole bucket);
              localFolder is the absolute path of the virtual bucket.
              isListed says whether the states come from a listing of the
              bucket, and listedAt when it was listed, in the format of
              modified or "" if never. revealLabel is the label of the
              action that shows a file in the file manager, such as "Show
              in Finder". message is a note on the last action, "" for none.
    busy      {busy: true|false}. The page is disabled while the host
              carries out a request.
    confirm   {id, title, message, confirmText}. Asks the user to confirm
              an action. The page replies with the request confirmed
              {id, confirmed: true|false}; closing the dialog any other way
              than its confirm button answers false.
    alert     {title, message, icon}. Tells the user something. icon is
              "error", "warning", "info" or "success", "error" if left out.
              No reply.
    progress  {id, title, message, value, cancelable}. Shows the progress
              of a task. value is a number from 0 to 1, or null for a task
              of unknown length. A later progress event with the same id
              updates the dialog, and fields left out keep their value.
              With cancelable true the dialog has a Cancel button, which
              sends the request progressCancel {id} once; the dialog stays
              until the host closes it.
    progressClose {id}. Closes the progress dialog of the id.

  Requests to the host
    ready           The page has loaded and can receive events. The host
                    answers with state.
    refresh         Read the local folder again and send the state.
    update          List the bucket, add placeholders for new objects and
                    compare the files with the listing.
    download        {paths}. Download the files.
    onlineOnly      {paths}. Replace the files with empty placeholders.
    open            {paths}. Open the one file with the application of the
                    system, downloading it first if it is online only.
    reveal          {paths}. Show the one file or folder in the file manager.
    openOnline      Open the page of the bucket in the Collaboratory,
                    https://wiki.ebrains.eu/bin/view/Collabs/<bucket>/Bucket,
                    with the web browser of the system.
    confirmed       {id, confirmed}. The answer to a confirm event.
    progressCancel  {id}. The user pressed Cancel in a progress dialog.

  The page draws a dialog only on a confirm, alert or progress event. A
  host with dialogs of its own, such as MATLAB, never sends them.

  Hosts
    uihtml     MATLAB calls setup(htmlComponent) once the page has loaded.
               Requests go through htmlComponent.sendEventToMATLAB(name,
               text). Events sent with sendEventToHTMLSource arrive as
               events of the component named after them, with the text in
               event.Data.
    pywebview  Python exposes as js_api an object with a method
               request(name, text), so that window.pywebview.api.request
               carries the requests. The page attaches to the host when
               window.pywebview exists, or on the pywebviewready event.
               Events are sent by evaluating
               window.virtualBucketBrowser.receive(name, text) in the page.
    none       In a plain browser the page draws but has no host: requests
               are logged to the console and dropped. Events can still be
               fed to the page through window.virtualBucketBrowser.receive,
               which helps when developing it.
-->
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #f6f7f9;
    --bg-hover: #f0f2f5;
    --bg-selected: #e6effd;
    --border: #e3e6ea;
    --text: #1d2228;
    --text-muted: #67707b;
    --accent: #2563eb;
    --accent-hover: #1d4fd8;
    --accent-text: #ffffff;
    --online: #2563eb;
    --online-bg: #e8f0fe;
    --downloaded: #16803c;
    --downloaded-bg: #e6f4ea;
    --differs: #b45309;
    --differs-bg: #fdf1e2;
    --local: #67707b;
    --local-bg: #eef0f2;
    --error: #b42318;
    --backdrop: rgba(16, 24, 40, 0.35);
    --shadow: 0 6px 24px rgba(16, 24, 40, 0.14), 0 1px 3px rgba(16, 24, 40, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1f24;
      --bg-subtle: #23272d;
      --bg-hover: #2a2f36;
      --bg-selected: #233656;
      --border: #333941;
      --text: #e6e8eb;
      --text-muted: #9aa3ad;
      --accent: #4f8cff;
      --accent-hover: #6b9dff;
      --online: #7aa7ff;
      --online-bg: #1f2d47;
      --downloaded: #5cc27f;
      --downloaded-bg: #1d3427;
      --differs: #f0a54a;
      --differs-bg: #3a2a17;
      --local: #9aa3ad;
      --local-bg: #2a2f36;
      --error: #f97066;
      --backdrop: rgba(0, 0, 0, 0.55);
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  svg.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
             stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .title { min-width: 0; flex: 1; }
  .title h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }
  .title .path { color: var(--text-muted); font-size: 12px; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .search {
    display: flex; align-items: center; gap: 6px; width: 280px;
    padding: 0 10px; height: 32px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-subtle); color: var(--text-muted);
  }
  .search:focus-within { border-color: var(--accent); background: var(--bg); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; }
  button {
    font: inherit; display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button:hover:not(:disabled) { background: var(--bg-hover); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.icon-only { padding: 0 8px; }

  /* Body */
  .content { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 260px; flex: none; overflow: auto; padding: 8px 6px;
    background: var(--bg-subtle);
  }
  .splitter {
    flex: none; width: 5px; margin-left: -2px; margin-right: -2px; z-index: 2;
    cursor: col-resize; position: relative;
  }
  .splitter::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--border);
  }
  .splitter:hover::after, body.resizing .splitter::after { width: 3px; left: 1px; background: var(--accent); }
  body.resizing { cursor: col-resize; }
  .tree-row {
    display: flex; align-items: center; gap: 4px; height: 28px; padding-right: 8px;
    border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  .tree-row:hover { background: var(--bg-hover); }
  .tree-row.current { background: var(--bg-selected); font-weight: 600; }
  .tree-row .chevron { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
                       color: var(--text-muted); flex: none; border-radius: 4px; }
  .tree-row .chevron svg { width: 12px; height: 12px; transition: transform 0.12s; }
  .tree-row.expanded .chevron svg { transform: rotate(90deg); }
  .tree-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .folder-icon { color: #e0a526; }
  .tree-row .badge { display: flex; }
  .tree-row .badge svg { width: 14px; height: 14px; }

  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .breadcrumb {
    display: flex; align-items: center; gap: 2px; padding: 10px 16px; min-height: 44px;
    border-bottom: 1px solid var(--border); overflow: hidden; white-space: nowrap;
  }
  .breadcrumb a { color: var(--text-muted); text-decoration: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  .breadcrumb a:hover { background: var(--bg-hover); color: var(--text); }
  .breadcrumb a:last-child { color: var(--text); font-weight: 600; }
  .breadcrumb .sep { color: var(--text-muted); }
  .breadcrumb .sep svg { width: 12px; height: 12px; }
  .breadcrumb .filter-note { margin-left: 8px; color: var(--text-muted); }

  .table-wrap { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    text-align: left; font-weight: 500; color: var(--text-muted); font-size: 12px;
    padding: 8px; border-bottom: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th .arrow { font-size: 10px; margin-left: 4px; }
  th.check, td.check { width: 40px; text-align: center; cursor: default; }
  th.status { width: 190px; } th.size { width: 100px; text-align: right; } th.modified { width: 140px; }
  tbody tr { height: 36px; cursor: default; }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr.selected { background: var(--bg-selected); }
  tbody td { padding: 0 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  td.size { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-muted); }
  td.modified { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .name-cell { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .name-cell span { overflow: hidden; text-overflow: ellipsis; }
  .name-cell .file-icon { color: var(--text-muted); }
  .name-cell .dim { color: var(--text-muted); }
  input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); cursor: pointer; margin: 0; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px;
    border-radius: 999px; font-size: 12px; font-weight: 500;
  }
  .pill svg { width: 13px; height: 13px; }
  .pill.online_only { color: var(--online); background: var(--online-bg); }
  .pill.downloaded { color: var(--downloaded); background: var(--downloaded-bg); }
  .pill.differs { color: var(--differs); background: var(--differs-bg); }
  .pill.local_only { color: var(--local); background: var(--local-bg); }
  .pill.Partial { color: var(--text-muted); background: var(--bg-hover); }
  .meter { width: 48px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .meter div { height: 100%; background: var(--downloaded); }

  .empty { padding: 48px 16px; text-align: center; color: var(--text-muted); }
  .more { padding: 12px 16px; color: var(--text-muted); }

  footer {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    border-top: 1px solid var(--border); background: var(--bg);
  }
  footer .summary { flex: 1; color: var(--text-muted); min-width: 0; overflow: hidden;
                    white-space: nowrap; text-overflow: ellipsis; }
  footer .summary b { color: var(--text); font-weight: 600; }
  .message { padding: 0 16px 10px; color: var(--text-muted); font-size: 12px; min-height: 16px; }

  /* Context menu */
  .menu {
    position: fixed; z-index: 10; min-width: 200px; padding: 4px; display: none;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  }
  .menu.open { display: block; }
  .menu .item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 5px; cursor: pointer; }
  .menu .item:hover { background: var(--bg-hover); }
  .menu .item.disabled { opacity: 0.4; pointer-events: none; }
  .menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

  /* Dialogs, drawn on a host's request. The last one opened is shown. */
  .dialog-layer {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: var(--backdrop);
  }
  .dialog-layer.open { display: flex; }
  .dialog {
    width: min(460px, calc(100vw - 32px)); padding: 16px 18px; user-select: text;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow);
  }
  .dialog:not(:last-child) { display: none; }
  .dialog h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; font-weight: 600; }
  .dialog h2 .dialog-icon { display: flex; }
  .dialog h2 .dialog-icon svg { width: 18px; height: 18px; }
  .dialog p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .progress-bar { height: 6px; margin-top: 12px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .progress-bar div { height: 100%; background: var(--accent); transition: width 0.2s; }
  .progress-bar.indeterminate div { width: 30%; animation: progress-slide 1.2s ease-in-out infinite; }
  @keyframes progress-slide { from { transform: translateX(-100%); } to { transform: translateX(334%); } }

  body.busy header, body.busy .content, body.busy footer { pointer-events: none; opacity: 0.6; }
  body.busy { cursor: progress; }
</style>
</head>
<body>
  <header>
    <div class="title">
      <h1 id="bucketName">&nbsp;</h1>
      <div class="path" id="localFolder">&nbsp;</div>
    </div>
    <label class="search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="filter" type="text" placeholder="Filter, such as ses-01 or *.nwb" spellcheck="false">
    </label>
    <button id="refresh" class="icon-only" title="Read the local folder again">
      <svg class="icon"><use href="#i-refresh"/></svg>
    </button>
    <button id="openOnline" title="Open the page of the bucket in the Collaboratory">
      <svg class="icon"><use href="#i-globe"/></svg>Open online
    </button>
    <button id="update" class="primary" title="List the bucket, add placeholders for new objects and compare the files with it">
      <svg class="icon"><use href="#i-cloud-sync"/></svg>Update from bucket
    </button>
  </header>

  <div class="content">
    <aside id="tree"></aside>
    <div class="splitter" id="splitter" title="Drag to resize. Double-click to reset."></div>
    <main>
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="table-wrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th class="check"><input type="checkbox" id="selectAll" title="Select all"></th>
              <th data-sort="name">Name</th>
              <th class="status" data-sort="status">Status</th>
              <th class="size" data-sort="size">Size</th>
              <th class="modified" data-sort="modified">Modified</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="tableNote"></div>
      </div>
    </main>
  </div>

  <footer>
    <div class="summary" id="summary"></div>
    <button id="download"><svg class="icon"><use href="#i-download"/></svg>Download</button>
    <button id="onlineOnly"><svg class="icon"><use href="#i-cloud"/></svg>Make online only</button>
    <button id="open"><svg class="icon"><use href="#i-open"/></svg>Open</button>
    <button id="reveal"><svg class="icon"><use href="#i-folder-open"/></svg><span id="revealLabel">Show in Finder</span></button>
  </footer>
  <div class="message" id="message"></div>

  <div class="menu" id="menu"></div>
  <div class="dialog-layer" id="dialogs"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.7-4.3L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 14.7 4.3L21 15"/><path d="M21 20v-5h-5"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-.9-9.9A6 6 0 0 1 17.6 9 4.5 4.5 0 0 1 17.5 18Z"/></symbol>
      <symbol id="i-cloud-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 0 1-.9-9.9A6 6 0 0 1 17.6 9 4.5 4.5 0 0 1 17.5 18Z"/><path d="m9.5 13.5 2.5 2.5 2.5-2.5"/><path d="M12 16v-6"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a13.5 13.5 0 0 1 0 18"/><path d="M12 3a13.5 13.5 0 0 0 0 18"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16 10"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19Z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></symbol>
      <symbol id="i-disk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M5 13 7.5 5h9L19 13"/><path d="M7 16.5h.1"/></symbol>
      <symbol id="i-partial" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
      <symbol id="i-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" fill="currentColor" fill-opacity="0.25"/></symbol>
      <symbol id="i-folder-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v10a2 2 0 0 0 2 2h12.5a2 2 0 0 0 1.9-1.4L21.5 11H7.4a2 2 0 0 0-1.9 1.4L3 19"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8v.1"/></symbol>
      <symbol id="i-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6"/><path d="m15 9-6 6"/></symbol>
    </defs>
  </svg>

<script>
"use strict";

// The table shows at most this many rows. More rows make the page slow
// to draw, and a filter finds a file faster than scrolling does.
const MAX_ROWS = 2000;

const STATE_INFO = {
  online_only: { label: "Online only", icon: "i-cloud", order: 0 },
  differs: { label: "Differs from bucket", icon: "i-alert", order: 1 },
  downloaded: { label: "Downloaded", icon: "i-check", order: 2 },
  local_only: { label: "Not in bucket", icon: "i-disk", order: 3 },
};

let meta = { bucketName: "", localFolder: "", prefix: "", isListed: false, listedAt: "", message: "" };
let files = [];
let folders = new Map();
const view = {
  folder: "",
  expanded: new Set([""]),
  selected: new Set(),   // keys of rows: "d:" + folder path or "f:" + file path
  anchorKey: null,
  sort: { key: "name", direction: 1 },
  filter: "",
  rows: [],
};

const $ = (id) => document.getElementById(id);
const icon = (id, cls = "") => `<svg class="icon ${cls}"><use href="#${id}"/></svg>`;

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function formatBytes(bytes) {
  if (bytes === null || bytes === undefined || Number.isNaN(bytes)) return "";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let exponent = bytes > 0 ? Math.floor(Math.log(bytes) / Math.log(1024)) : 0;
  exponent = Math.min(Math.max(exponent, 0), units.length - 1);
  return exponent === 0 ? `${bytes} B` : `${(bytes / 1024 ** exponent).toFixed(1)} ${units[exponent]}`;
}

function countText(count, noun) {
  return `${count} ${noun}${count === 1 ? "" : "s"}`;
}

function parentOf(path) {
  const index = path.lastIndexOf("/");
  return index < 0 ? "" : path.slice(0, index);
}

function nameOf(path) {
  return path.slice(path.lastIndexOf("/") + 1);
}

// ---------------------------------------------------------------- Model

function receiveState(state) {
  meta = state;
  const f = state.files;
  files = f.path.map((path, i) => ({
    path,
    name: nameOf(path),
    folder: parentOf(path),
    state: f.state[i],
    localBytes: f.localBytes[i],
    remoteBytes: f.remoteBytes[i],
    modified: f.modified[i],
  }));
  buildFolders();

  if (!folders.has(view.folder)) view.folder = "";
  for (const key of [...view.selected]) {
    const path = key.slice(2);
    const exists = key.startsWith("d:") ? folders.has(path) : files.some((file) => file.path === path);
    if (!exists) view.selected.delete(key);
  }
  renderAll();
}

function newFolder(path) {
  return {
    path, name: path === "" ? meta.bucketName : nameOf(path), parent: parentOf(path),
    children: new Set(), files: [],
    total: 0, online: 0, differs: 0, localBytes: 0, remoteBytes: 0, latest: "",
  };
}

function ensureFolder(path) {
  let folder = folders.get(path);
  if (folder) return folder;
  folder = newFolder(path);
  folders.set(path, folder);
  if (path !== "") ensureFolder(folder.parent).children.add(path);
  return folder;
}

function buildFolders() {
  folders = new Map();
  ensureFolder("");
  for (const file of files) {
    ensureFolder(file.folder).files.push(file);
    // Every folder above the file counts it
    let path = file.folder;
    for (;;) {
      const folder = folders.get(path);
      folder.total += 1;
      if (file.state === "online_only") folder.online += 1;
      if (file.state === "differs") folder.differs += 1;
      folder.localBytes += file.localBytes || 0;
      folder.remoteBytes += file.remoteBytes || 0;
      if (file.state !== "online_only" && file.modified > folder.latest) folder.latest = file.modified;
      if (path === "") break;
      path = parentOf(path);
    }
  }
}

function filesBelow(folderPath) {
  if (folderPath === "") return files;
  const start = folderPath + "/";
  return files.filter((file) => file.path.startsWith(start));
}

function matchesFilter(file, filterText) {
  const text = filterText.trim().toLowerCase();
  if (text === "") return true;
  if (/[*?]/.test(text)) {
    const expression = "^" + text.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*").replace(/\?/g, ".") + "$";
    return new RegExp(expression).test(file.name.toLowerCase());
  }
  return file.path.toLowerCase().includes(text);
}

function currentRows() {
  let rows;
  if (view.filter.trim() === "") {
    const folder = folders.get(view.folder);
    const subfolders = [...folder.children].map((path) => ({ key: "d:" + path, kind: "folder", folder: folders.get(path) }));
    const ownFiles = folder.files.map((file) => ({ key: "f:" + file.path, kind: "file", file }));
    rows = [...sortRows(subfolders), ...sortRows(ownFiles)];
  } else {
    rows = sortRows(filesBelow(view.folder)
      .filter((file) => matchesFilter(file, view.filter))
      .map((file) => ({ key: "f:" + file.path, kind: "file", file })));
  }
  return rows;
}

function rowSortValue(row, key) {
  if (row.kind === "folder") {
    const folder = row.folder;
    switch (key) {
      case "status": return folder.online / Math.max(folder.total, 1);
      case "size": return meta.isListed ? folder.remoteBytes : folder.localBytes;
      case "modified": return folder.latest;
      default: return folder.name.toLowerCase();
    }
  }
  const file = row.file;
  switch (key) {
    case "status": return STATE_INFO[file.state].order;
    case "size": return fileSize(file) ?? -1;
    case "modified": return file.state === "online_only" ? "" : file.modified;
    default: return displayName(file).toLowerCase();
  }
}

function sortRows(rows) {
  const { key, direction } = view.sort;
  return rows
    .map((row) => ({ row, value: rowSortValue(row, key) }))
    .sort((a, b) => (a.value < b.value ? -direction : a.value > b.value ? direction : 0))
    .map((item) => item.row);
}

// The size of the object, where the bucket has been listed, is the size of
// the file whatever its state. Otherwise only a downloaded file tells it.
function fileSize(file) {
  if (file.remoteBytes !== null && file.remoteBytes !== undefined) return file.remoteBytes;
  if (file.localBytes > 0) return file.localBytes;
  return null;
}

function displayName(file) {
  if (view.filter.trim() === "") return file.name;
  return view.folder === "" ? file.path : file.path.slice(view.folder.length + 1);
}

function selectedFiles() {
  const result = new Map();
  for (const key of view.selected) {
    const path = key.slice(2);
    const list = key.startsWith("d:") ? filesBelow(path) : files.filter((file) => file.path === path);
    for (const file of list) result.set(file.path, file);
  }
  return [...result.values()];
}

// ---------------------------------------------------------------- Rendering

function renderAll() {
  $("bucketName").textContent = meta.prefix ? `${meta.bucketName} / ${meta.prefix}` : meta.bucketName;
  // The path is cut at the start when it is too long, which the right-to-left
  // direction of its element does. The marks keep its slashes in place.
  $("localFolder").textContent = "\u200E" + meta.localFolder + "\u200E";
  $("localFolder").title = meta.localFolder;
  $("revealLabel").textContent = meta.revealLabel || "Show in folder";
  renderTree();
  renderBreadcrumb();
  renderTable();
  renderFooter();
}

function folderBadge(folder) {
  if (folder.total === 0) return "";
  if (folder.differs > 0) return `<span class="badge" style="color:var(--differs)" title="Some files differ from the bucket">${icon("i-alert")}</span>`;
  if (folder.online === folder.total) return `<span class="badge" style="color:var(--online)" title="Online only">${icon("i-cloud")}</span>`;
  if (folder.online === 0) return `<span class="badge" style="color:var(--downloaded)" title="Downloaded">${icon("i-check")}</span>`;
  return `<span class="badge" style="color:var(--text-muted)" title="${folder.total - folder.online} of ${folder.total} files downloaded">${icon("i-partial")}</span>`;
}

function renderTree() {
  const parts = [];
  const visit = (path, depth) => {
    const folder = folders.get(path);
    const hasChildren = folder.children.size > 0;
    const isExpanded = view.expanded.has(path);
    const classes = ["tree-row", path === view.folder ? "current" : "", isExpanded ? "expanded" : ""].join(" ");
    parts.push(
      `<div class="${classes}" data-path="${escapeHtml(path)}" style="padding-left:${4 + depth * 14}px">` +
      `<span class="chevron" data-toggle="1">${hasChildren ? icon("i-chevron") : ""}</span>` +
      `${icon("i-folder", "folder-icon")}<span class="name">${escapeHtml(folder.name)}</span>${folderBadge(folder)}</div>`);
    if (hasChildren && isExpanded) {
      [...folder.children].sort((a, b) => a.localeCompare(b)).forEach((child) => visit(child, depth + 1));
    }
  };
  visit("", 0);
  $("tree").innerHTML = parts.join("");
}

function renderBreadcrumb() {
  const crumbs = [`<a data-path="">${escapeHtml(meta.bucketName)}</a>`];
  if (view.folder !== "") {
    const segments = view.folder.split("/");
    segments.forEach((segment, i) => {
      crumbs.push(`<span class="sep">${icon("i-chevron")}</span>`);
      crumbs.push(`<a data-path="${escapeHtml(segments.slice(0, i + 1).join("/"))}">${escapeHtml(segment)}</a>`);
    });
  }
  if (view.filter.trim() !== "") {
    crumbs.push(`<span class="filter-note">· matches in this folder and its subfolders</span>`);
  }
  $("breadcrumb").innerHTML = crumbs.join("");
}

function statusPill(state) {
  const info = STATE_INFO[state];
  return `<span class="pill ${state}">${icon(info.icon)}${info.label}</span>`;
}

function folderStatus(folder) {
  if (folder.total === 0) return "";
  if (folder.differs > 0) return `<span class="pill differs">${icon("i-alert")}${folder.differs} differ</span>`;
  if (folder.online === folder.total) return statusPill("online_only");
  if (folder.online === 0) return statusPill("downloaded");
  const downloaded = folder.total - folder.online;
  const percent = Math.round((100 * downloaded) / folder.total);
  return `<span class="pill Partial"><span class="meter"><div style="width:${percent}%"></div></span>${downloaded} of ${folder.total}</span>`;
}

function renderTable() {
  const rows = currentRows();
  view.rows = rows;
  const shown = rows.slice(0, MAX_ROWS);

  const html = shown.map((row) => {
    const isSelected = view.selected.has(row.key);
    if (row.kind === "folder") {
      const folder = row.folder;
      const size = meta.isListed ? folder.remoteBytes : folder.localBytes;
      return `<tr class="${isSelected ? "selected" : ""}" data-key="${escapeHtml(row.key)}">` +
        `<td class="check"><input type="checkbox" ${isSelected ? "checked" : ""}></td>` +
        `<td><div class="name-cell">${icon("i-folder", "folder-icon")}<span>${escapeHtml(folder.name)}</span></div></td>` +
        `<td>${folderStatus(folder)}</td>` +
        `<td class="size">${formatBytes(size)}</td>` +
        `<td class="modified">${escapeHtml(folder.latest)}</td></tr>`;
    }
    const file = row.file;
    const name = displayName(file);
    const folderPart = name.includes("/") ? `<span class="dim">${escapeHtml(parentOf(name))}/</span>` : "";
    return `<tr class="${isSelected ? "selected" : ""}" data-key="${escapeHtml(row.key)}">` +
      `<td class="check"><input type="checkbox" ${isSelected ? "checked" : ""}></td>` +
      `<td><div class="name-cell" title="${escapeHtml(file.path)}">${icon("i-file", "file-icon")}<span>${folderPart}${escapeHtml(file.name)}</span></div></td>` +
      `<td>${statusPill(file.state)}</td>` +
      `<td class="size">${formatBytes(fileSize(file))}</td>` +
      `<td class="modified">${file.state === "online_only" ? "" : escapeHtml(file.modified)}</td></tr>`;
  });
  $("rows").innerHTML = html.join("");

  let note = "";
  if (rows.length === 0) {
    note = `<div class="empty">${view.filter.trim() ? "No files match the filter." : "This folder is empty."}</div>`;
  } else if (rows.length > shown.length) {
    note = `<div class="more">Showing the first ${shown.length} of ${rows.length} items. Use the filter to narrow them down.</div>`;
  }
  $("tableNote").innerHTML = note;

  for (const th of document.querySelectorAll("thead th[data-sort]")) {
    const label = th.textContent.replace(/[▲▼]/g, "").trim();
    th.innerHTML = escapeHtml(label) + (th.dataset.sort === view.sort.key
      ? `<span class="arrow">${view.sort.direction > 0 ? "▲" : "▼"}</span>` : "");
  }
  const selectAll = $("selectAll");
  const nSelectedShown = rows.filter((row) => view.selected.has(row.key)).length;
  selectAll.checked = rows.length > 0 && nSelectedShown === rows.length;
  selectAll.indeterminate = nSelectedShown > 0 && nSelectedShown < rows.length;
}

function renderFooter() {
  const selection = selectedFiles();
  const states = new Set(selection.map((file) => file.state));
  $("download").disabled = !(states.has("online_only") || states.has("differs"));
  $("onlineOnly").disabled = !(states.has("downloaded") || states.has("differs"));
  $("open").disabled = view.selected.size !== 1;

  let summary;
  if (view.selected.size > 0) {
    const bytes = selection.reduce((sum, file) => sum + (fileSize(file) || 0), 0);
    const nOnline = selection.filter((file) => file.state === "online_only").length;
    summary = `<b>${countText(selection.length, "file")} selected</b> · ${formatBytes(bytes)}` +
      (nOnline > 0 ? ` · ${nOnline} online only` : "");
  } else {
    const folder = folders.get(view.folder);
    const downloaded = folder.total - folder.online;
    summary = `${countText(folder.total, "file")} · <b>${downloaded} downloaded</b> (${formatBytes(folder.localBytes)} on disk)` +
      (meta.isListed ? ` · ${formatBytes(folder.remoteBytes)} in bucket` : "");
  }
  $("summary").innerHTML = summary;

  let listingNote;
  if (!meta.isListed) {
    listingNote = "Status is judged from the local files: empty files are online only. " +
      "Update from the bucket to find new objects and files that differ.";
  } else if (meta.listedAt) {
    listingNote = `Compared with the bucket as listed on ${meta.listedAt}. ` +
      "Update from the bucket to see what changed since.";
  } else {
    listingNote = "Compared with the last listing of the bucket.";
  }
  $("message").textContent = meta.message ? `${meta.message} ${listingNote}` : listingNote;
}

// ---------------------------------------------------------------- Host bridge
//
// The host is the program that shows the page. Requests go out and events
// come in through `host` alone, so that nothing else in the page depends
// on how a host is wired. Handlers are registered before a host attaches,
// and a host gets the ready request once it has. Without a host, as in a
// plain browser, requests are logged and dropped.
const host = (() => {
  const handlers = new Map();
  let transport = null;

  function dispatch(name, text) {
    const handler = handlers.get(name);
    if (!handler) {
      console.warn(`virtualBucketBrowser: no handler for the event "${name}"`);
      return;
    }
    handler(JSON.parse(text));
  }

  const bridge = {
    on(name, handler) {
      handlers.set(name, handler);
    },
    send(name, data = {}) {
      if (!transport) {
        console.info(`virtualBucketBrowser: no host for the request "${name}"`, data);
        return;
      }
      transport.send(name, JSON.stringify(data));
    },
    // A transport sends a request as (name, text). One whose events come
    // as callbacks of its own, like uihtml, also has listen(name, receive).
    attach(newTransport) {
      transport = newTransport;
      if (transport.listen) {
        for (const name of handlers.keys()) transport.listen(name, (text) => dispatch(name, text));
      }
      bridge.send("ready");
    },
    dispatch,
  };
  return bridge;
})();

// ---------------------------------------------------------------- Interaction

function selectedPaths() {
  return selectedFiles().map((file) => file.path);
}

function openFolder(path) {
  view.folder = path;
  view.selected.clear();
  view.anchorKey = null;
  // The folders above the current one are expanded, so that it shows
  let parent = path;
  while (parent !== "") {
    parent = parentOf(parent);
    view.expanded.add(parent);
  }
  renderAll();
  $("tableWrap").scrollTop = 0;
}

function openRow(key) {
  const path = key.slice(2);
  if (key.startsWith("d:")) openFolder(path);
  else host.send("open", { paths: [path] });
}

function selectRow(key, event) {
  const keys = view.rows.map((row) => row.key);
  if (event.shiftKey && view.anchorKey && keys.includes(view.anchorKey)) {
    const [from, to] = [keys.indexOf(view.anchorKey), keys.indexOf(key)].sort((a, b) => a - b);
    if (!(event.metaKey || event.ctrlKey)) view.selected.clear();
    keys.slice(from, to + 1).forEach((k) => view.selected.add(k));
  } else if (event.metaKey || event.ctrlKey || event.target.type === "checkbox") {
    if (view.selected.has(key)) view.selected.delete(key);
    else view.selected.add(key);
    view.anchorKey = key;
  } else {
    view.selected.clear();
    view.selected.add(key);
    view.anchorKey = key;
  }
  renderTable();
  renderFooter();
}

function showMenu(x, y, items) {
  const menu = $("menu");
  menu.innerHTML = items.map((item, i) => item === "-" ? "<hr>"
    : `<div class="item ${item.disabled ? "disabled" : ""}" data-index="${i}">${icon(item.icon)}${escapeHtml(item.label)}</div>`).join("");
  menu.onclick = (event) => {
    const element = event.target.closest(".item");
    if (!element) return;
    hideMenu();
    items[Number(element.dataset.index)].run();
  };
  menu.classList.add("open");
  const rect = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, window.innerWidth - rect.width - 4) + "px";
  menu.style.top = Math.min(y, window.innerHeight - rect.height - 4) + "px";
}

function hideMenu() {
  $("menu").classList.remove("open");
}

function fileMenuItems() {
  const states = new Set(selectedFiles().map((file) => file.state));
  const single = view.selected.size === 1 ? [...view.selected][0] : null;
  return [
    { label: "Download", icon: "i-download", disabled: !(states.has("online_only") || states.has("differs")),
      run: () => host.send("download", { paths: selectedPaths() }) },
    { label: "Make online only", icon: "i-cloud", disabled: !(states.has("downloaded") || states.has("differs")),
      run: () => host.send("onlineOnly", { paths: selectedPaths() }) },
    "-",
    { label: "Open", icon: "i-open", disabled: !single, run: () => openRow(single) },
    { label: meta.revealLabel || "Show in folder", icon: "i-folder-open", disabled: view.selected.size === 0,
      run: () => host.send("reveal", { paths: [[...view.selected][0].slice(2)] }) },
  ];
}

function folderMenuItems(path) {
  const states = new Set(filesBelow(path).map((file) => file.state));
  return [
    { label: "Download folder", icon: "i-download", disabled: !(states.has("online_only") || states.has("differs")),
      run: () => host.send("download", { paths: filesBelow(path).map((file) => file.path) }) },
    { label: "Make folder online only", icon: "i-cloud", disabled: !(states.has("downloaded") || states.has("differs")),
      run: () => host.send("onlineOnly", { paths: filesBelow(path).map((file) => file.path) }) },
    "-",
    { label: meta.revealLabel || "Show in folder", icon: "i-folder-open", run: () => host.send("reveal", { paths: [path] }) },
  ];
}

function setBusy(isBusy) {
  document.body.classList.toggle("busy", isBusy);
  if (isBusy) hideMenu();
}

// The width of the folder panel is kept between sessions where the page
// can store it. Storage can be unavailable, in which case the default is used.
const DEFAULT_TREE_WIDTH = 260;
const WIDTH_KEY = "virtualBucketBrowser.treeWidth";

function setTreeWidth(width) {
  const clamped = Math.round(Math.min(Math.max(width, 160), window.innerWidth * 0.6));
  $("tree").style.width = clamped + "px";
  return clamped;
}

function wireSplitter() {
  try {
    const stored = Number(window.localStorage.getItem(WIDTH_KEY));
    if (stored > 0) setTreeWidth(stored);
  } catch (error) { /* storage unavailable: keep the default width */ }

  const splitter = $("splitter");
  splitter.addEventListener("mousedown", (event) => {
    event.preventDefault();
    const startX = event.clientX;
    const startWidth = $("tree").getBoundingClientRect().width;
    document.body.classList.add("resizing");
    const onMove = (moveEvent) => setTreeWidth(startWidth + moveEvent.clientX - startX);
    const onUp = () => {
      document.body.classList.remove("resizing");
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      try {
        window.localStorage.setItem(WIDTH_KEY, String(Math.round($("tree").getBoundingClientRect().width)));
      } catch (error) { /* storage unavailable: the width lasts for this session */ }
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
  splitter.addEventListener("dblclick", () => {
    setTreeWidth(DEFAULT_TREE_WIDTH);
    try { window.localStorage.removeItem(WIDTH_KEY); } catch (error) { /* nothing stored */ }
  });
}

function wireEvents() {
  wireSplitter();
  $("tree").addEventListener("click", (event) => {
    const row = event.target.closest(".tree-row");
    if (!row) return;
    const path = row.dataset.path;
    if (event.target.closest("[data-toggle]") && folders.get(path).children.size > 0) {
      if (view.expanded.has(path)) view.expanded.delete(path);
      else view.expanded.add(path);
      renderTree();
    } else {
      openFolder(path);
    }
  });
  $("tree").addEventListener("dblclick", (event) => {
    const row = event.target.closest(".tree-row");
    if (!row || event.target.closest("[data-toggle]")) return;
    const path = row.dataset.path;
    if (view.expanded.has(path)) view.expanded.delete(path);
    else view.expanded.add(path);
    renderTree();
  });
  $("tree").addEventListener("contextmenu", (event) => {
    const row = event.target.closest(".tree-row");
    if (!row) return;
    event.preventDefault();
    showMenu(event.clientX, event.clientY, folderMenuItems(row.dataset.path));
  });

  $("breadcrumb").addEventListener("click", (event) => {
    const link = event.target.closest("a[data-path]");
    if (link) openFolder(link.dataset.path);
  });

  $("rows").addEventListener("click", (event) => {
    const row = event.target.closest("tr[data-key]");
    if (row) selectRow(row.dataset.key, event);
  });
  $("rows").addEventListener("dblclick", (event) => {
    const row = event.target.closest("tr[data-key]");
    if (row && event.target.type !== "checkbox") openRow(row.dataset.key);
  });
  $("rows").addEventListener("contextmenu", (event) => {
    const row = event.target.closest("tr[data-key]");
    if (!row) return;
    event.preventDefault();
    // A right-click on a row that is not selected acts on that row
    if (!view.selected.has(row.dataset.key)) {
      view.selected.clear();
      view.selected.add(row.dataset.key);
      view.anchorKey = row.dataset.key;
      renderTable();
      renderFooter();
    }
    showMenu(event.clientX, event.clientY, fileMenuItems());
  });

  document.querySelector("thead").addEventListener("click", (event) => {
    const th = event.target.closest("th[data-sort]");
    if (!th) return;
    const key = th.dataset.sort;
    view.sort = { key, direction: view.sort.key === key ? -view.sort.direction : 1 };
    renderTable();
  });
  $("selectAll").addEventListener("change", (event) => {
    for (const row of view.rows) {
      if (event.target.checked) view.selected.add(row.key);
      else view.selected.delete(row.key);
    }
    renderTable();
    renderFooter();
  });

  $("filter").addEventListener("input", (event) => {
    view.filter = event.target.value;
    view.selected.clear();
    renderBreadcrumb();
    renderTable();
    renderFooter();
  });

  $("refresh").addEventListener("click", () => host.send("refresh"));
  $("update").addEventListener("click", () => host.send("update"));
  $("openOnline").addEventListener("click", () => host.send("openOnline"));
  $("download").addEventListener("click", () => host.send("download", { paths: selectedPaths() }));
  $("onlineOnly").addEventListener("click", () => host.send("onlineOnly", { paths: selectedPaths() }));
  $("open").addEventListener("click", () => openRow([...view.selected][0]));
  $("reveal").addEventListener("click", () => {
    const key = [...view.selected][0];
    host.send("reveal", { paths: [key ? key.slice(2) : view.folder] });
  });

  document.addEventListener("click", (event) => {
    if (!event.target.closest("#menu")) hideMenu();
  });
  document.addEventListener("keydown", (event) => {
    // Keys go to an open dialog first: the page draws them for a host
    // without its own, also while the host is busy
    if (dialogs.isOpen()) {
      dialogs.onKey(event);
      return;
    }
    // The host takes no requests while it is busy, as with pointer events
    if (document.body.classList.contains("busy")) return;
    const isTyping = event.target.tagName === "INPUT" && event.target.type === "text";
    if (event.key === "Escape") {
      hideMenu();
      if (!isTyping) { view.selected.clear(); renderTable(); renderFooter(); }
    } else if (!isTyping && (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "a") {
      event.preventDefault();
      view.rows.forEach((row) => view.selected.add(row.key));
      renderTable();
      renderFooter();
    } else if (!isTyping && event.key === "Enter" && view.selected.size === 1) {
      openRow([...view.selected][0]);
    } else if (!isTyping && event.key === "Backspace" && view.folder !== "") {
      openFolder(parentOf(view.folder));
    } else if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "f") {
      event.preventDefault();
      $("filter").focus();
    }
  });
}

// ---------------------------------------------------------------- Dialogs
//
// A host without dialogs of its own asks the page to draw them with the
// confirm, alert and progress events. One dialog shows at a time, the
// last one opened; the ones below it wait until it closes.

const DIALOG_ICONS = {
  error: { icon: "i-error", color: "var(--error)" },
  warning: { icon: "i-alert", color: "var(--differs)" },
  info: { icon: "i-info", color: "var(--accent)" },
  success: { icon: "i-check", color: "var(--downloaded)" },
};

const dialogs = (() => {
  const stack = [];
  const progressById = new Map();

  function build(kind, { title, iconName, message, extraHtml = "", buttonsHtml }) {
    const iconInfo = DIALOG_ICONS[iconName];
    const iconHtml = iconInfo ? `<span class="dialog-icon" style="color:${iconInfo.color}">${icon(iconInfo.icon)}</span>` : "";
    const element = document.createElement("div");
    element.className = `dialog ${kind}`;
    element.setAttribute("role", "dialog");
    element.innerHTML = `<h2>${iconHtml}<span class="dialog-title">${escapeHtml(title)}</span></h2>` +
      `<p>${escapeHtml(message)}</p>${extraHtml}<div class="buttons">${buttonsHtml}</div>`;
    return element;
  }

  function top() {
    return stack[stack.length - 1];
  }

  function focusTop() {
    const dialog = top();
    $("dialogs").classList.toggle("open", Boolean(dialog));
    if (dialog) dialog.element.querySelector("[data-focus]")?.focus();
  }

  function show(dialog) {
    hideMenu();
    stack.push(dialog);
    $("dialogs").appendChild(dialog.element);
    focusTop();
  }

  function close(dialog) {
    const index = stack.indexOf(dialog);
    if (index < 0) return;
    stack.splice(index, 1);
    dialog.element.remove();
    focusTop();
  }

  function onButton(element, run) {
    element.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (button && !button.disabled) run(button.dataset.action);
    });
  }

  // Cancel has the focus, as the safe answer to a question about losing data
  function confirm({ id, title, message, confirmText }) {
    const dialog = {};
    dialog.element = build("confirm", { title, iconName: "warning", message, buttonsHtml:
      `<button data-action="cancel" data-focus>Cancel</button>` +
      `<button class="primary" data-action="confirm">${escapeHtml(confirmText)}</button>` });
    const answer = (confirmed) => {
      close(dialog);
      host.send("confirmed", { id, confirmed });
    };
    onButton(dialog.element, (action) => answer(action === "confirm"));
    dialog.onEscape = () => answer(false);
    show(dialog);
  }

  function alert({ title, message, icon: iconName = "error" }) {
    const dialog = {};
    dialog.element = build("alert", { title, iconName, message, buttonsHtml:
      `<button class="primary" data-action="ok" data-focus>OK</button>` });
    onButton(dialog.element, () => close(dialog));
    dialog.onEscape = () => close(dialog);
    show(dialog);
  }

  function progress(data) {
    let dialog = progressById.get(data.id);
    if (!dialog) {
      dialog = { title: "", message: "", value: null, cancelable: false, cancelRequested: false };
      dialog.element = build("progress", { title: "", message: "",
        extraHtml: `<div class="progress-bar"><div></div></div>`,
        buttonsHtml: `<button data-action="cancel" data-focus>Cancel</button>` });
      // The host hears of the cancel once, and closes the dialog itself
      onButton(dialog.element, () => {
        dialog.cancelRequested = true;
        renderProgress(dialog);
        host.send("progressCancel", { id: data.id });
      });
      progressById.set(data.id, dialog);
      show(dialog);
    }
    for (const key of ["title", "message", "value", "cancelable"]) {
      if (data[key] !== undefined) dialog[key] = data[key];
    }
    renderProgress(dialog);
  }

  function renderProgress(dialog) {
    const element = dialog.element;
    element.querySelector(".dialog-title").textContent = dialog.title;
    element.querySelector("p").textContent = dialog.message;
    const bar = element.querySelector(".progress-bar");
    const isIndeterminate = dialog.value === null || dialog.value === undefined;
    bar.classList.toggle("indeterminate", isIndeterminate);
    bar.firstElementChild.style.width = isIndeterminate ? "" : `${Math.round(100 * Math.min(Math.max(dialog.value, 0), 1))}%`;
    const cancel = element.querySelector("button");
    cancel.style.display = dialog.cancelable ? "" : "none";
    cancel.disabled = dialog.cancelRequested;
    cancel.textContent = dialog.cancelRequested ? "Cancelling…" : "Cancel";
  }

  function closeProgress(id) {
    const dialog = progressById.get(id);
    if (!dialog) return;
    progressById.delete(id);
    close(dialog);
  }

  // Keys while a dialog is open go to it: Escape closes it, Tab stays among
  // its buttons, and the focused button takes Enter itself.
  function onKey(event) {
    const dialog = top();
    if (event.key === "Escape") {
      if (dialog.onEscape) dialog.onEscape();
    } else if (event.key === "Tab") {
      const buttons = [...dialog.element.querySelectorAll("button")]
        .filter((button) => !button.disabled && button.style.display !== "none");
      if (buttons.length === 0) return;
      event.preventDefault();
      const index = buttons.indexOf(document.activeElement);
      const step = event.shiftKey ? -1 : 1;
      buttons[(index + step + buttons.length) % buttons.length].focus();
    }
  }

  return { confirm, alert, progress, closeProgress, onKey, isOpen: () => stack.length > 0 };
})();

// ---------------------------------------------------------------- Hosts

// MATLAB's uihtml component calls setup(htmlComponent) once the page has
// loaded. Its events carry the JSON text in Data.
function setup(htmlComponent) {
  host.attach({
    send: (name, text) => htmlComponent.sendEventToMATLAB(name, text),
    listen: (name, receive) => htmlComponent.addEventListener(name, (event) => receive(event.Data)),
  });
}

// A host that evaluates JavaScript in the page, such as pywebview, sends
// its events through this global.
window.virtualBucketBrowser = { receive: (name, text) => host.dispatch(name, text) };

// pywebview exposes the Python host as window.pywebview.api, which can
// appear after the page has loaded; pywebviewready says when it has.
// window.pywebview can exist before its api does, so the api is checked.
function attachPywebview() {
  host.attach({
    send: (name, text) => window.pywebview.api.request(name, text)
      .catch((error) => console.error(`virtualBucketBrowser: the request "${name}" failed`, error)),
  });
}

host.on("state", receiveState);
host.on("busy", (data) => setBusy(data.busy));
host.on("confirm", dialogs.confirm);
host.on("alert", dialogs.alert);
host.on("progress", dialogs.progress);
host.on("progressClose", (data) => dialogs.closeProgress(data.id));
wireEvents();
if (window.pywebview?.api?.request) attachPywebview();
else window.addEventListener("pywebviewready", attachPywebview, { once: true });
</script>
