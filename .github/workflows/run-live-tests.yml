name: Live test

# Scheduled and on-demand entry point for the live integration tests; see
# live-integration-tests.yml for what they cover. Also run as a release
# prerequisite by prepare-release.yml.

on:
  schedule:
    # Once a week: the APIs under test change rarely enough not to need a
    # daily run.
    - cron: '23 4 * * 1'

  workflow_dispatch:

# A run cancelled during a test skips the teardown that deletes the objects
# the test made in the bucket, so a run that overlaps waits for the first
# to finish instead of cancelling it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-live-tests:
    uses: ./.github/workflows/live-integration-tests.yml
    secrets:
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
