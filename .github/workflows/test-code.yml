name: Test code

on:
  push:
    branches: [ "main" ]
    # "*" does not match "/", so '*md' only ever matched markdown files in
    # the repository root. Workflow files are no longer skipped: a change to
    # the CI itself is the one change that most needs the suite to run. The
    # badge commit the workflow pushes carries [skip ci], so it does not
    # start another run.
    paths-ignore:
      - '**.md'

  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

  workflow_dispatch:

# The called workflow declares no permissions of its own, so these are the
# ones its job runs with. It commits regenerated badges and uploads the code
# issues report to code scanning; everything else it does needs no token.
permissions:
  contents: write
  security-events: write
  actions: read  # only required for workflows in private repositories

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-code:
    name: Analyse and test code
    uses: ehennestad/matbox-actions/.github/workflows/test-code-workflow.yml@v1
    with:
      matlab_release: latest
      matlab_use_cache: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
