# Named after "Live test", the workflow to run, and marked as the job that
# workflow calls. GitHub lists this file in the Actions sidebar too, but it
# only has a workflow_call trigger, so it cannot be started from there and its
# runs are recorded under the workflows that call it.
name: Live test (reusable job)

# Reusable job: runs the tests tagged "LiveIntegration" against the real
# EBRAINS Data Proxy, Knowledge Graph, and Collaboratory APIs, authenticated
# as a service account through the OIDC Client Credentials flow. Called by
# run-live-tests.yml (scheduled, and on demand) and by prepare-release.yml
# (so a release is only prepared once a fresh run against the exact commit
# being released has passed). These tests are excluded from the "Test code"
# workflow; see tools/tasks/testToolbox.m.

on:
  workflow_call:
    secrets:
      OIDC_CLIENT_SECRET:
        required: true

# Checking the repository out is all the job needs the token for; the EBRAINS
# APIs it talks to are authenticated with the service account below.
permissions:
  contents: read

jobs:
  run-live-tests:
    name: Run live integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB (latest)
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true

      - name: Install MatBox
        uses: ehennestad/matbox-actions/install-matbox@v1

      - name: Run live integration tests
        uses: matlab-actions/run-command@v2
        env:
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        with:
          command: |
            addpath(genpath("src"))
            addpath(genpath("tests"))
            addpath(genpath("tools"))

            % Service account dedicated to this repo's CI, added as an
            % editor on the eivihe-sandbox collab. The secret reaches MATLAB
            % through the environment rather than being expanded into this
            % command: a secret pasted into a script is one quotation mark
            % away from ending the string it was meant to stay inside, and
            % it would be part of the command GitHub composes and runs.
            ebrains.authenticate(...
                "OAuthFlow", "ClientCredentialsFlow", ...
                "OIDCClientID", "ebrains-services-toolbox-matlab-ci", ...
                "OIDCClientSecret", getenv("OIDC_CLIENT_SECRET"))

            runLiveIntegrationTests()
