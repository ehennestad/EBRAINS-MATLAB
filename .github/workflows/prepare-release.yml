name: Prepare toolbox release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Matches tags like v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number in major.minor.patch format'
        required: true
        type: string

jobs:
  live-test:
    name: Verify live API access before release
    # A release must prove it still talks to the real Data Proxy, Knowledge
    # Graph, and Collaboratory APIs. Runs fresh against the exact commit or
    # tag being released, rather than relying on the weekly schedule's last
    # result, which could be stale or could predate this release's changes.
    uses: ./.github/workflows/live-integration-tests.yml
    secrets:
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}

  prepare-release:
    name: Prepare toolbox release
    needs: live-test
    uses: ehennestad/matbox-actions/.github/workflows/prepare-release-workflow.yml@v1
    with:
      # Do not change
      version: ${{ inputs.version }}
      
      # Do not change
      ref_name: ${{ github.ref_name }}
      
      # Path to directory containing source code. This directory will be packaged
      # into the toolbox. Important: This should not be a namespace directory
      source_directory: src
      
      # Path to directory containing tests. This directory will be used for
      # locating MATLAB  test suites
      tests_directory: tests

      # Path to directory containing tools and MLToolboxInfo.json. Used for finding
      # unit tests, running customized MatBox tasks, and determining toolbox metadata
      tools_directory: tools
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
