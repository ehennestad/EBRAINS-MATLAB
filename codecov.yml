coverage:
  status:
    # The project total is informational: with target auto it only has to
    # hold the line, so a pull request is not failed for gaps it did not
    # introduce. The breakdown of a run is in the "reports" artifact of the
    # "Test code" workflow; docs/reports is generated, not committed.
    project:
      default:
        target: auto
        threshold: 1%

    # New and changed lines are held to a real bar instead: 80% of a patch
    # must be covered, so new gaps stop accumulating even while the
    # project average is still catching up.
    patch:
      default:
        target: 80%
